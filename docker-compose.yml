services:
  postgres:
    build:
      context: ./backend
      dockerfile: Dockerfile.postgres
    container_name: mob-postgres
    environment:
      POSTGRES_USER: mob_user
      POSTGRES_PASSWORD: mob_password
      POSTGRES_DB: mob_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mob_user -d mob_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mob-backend
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://mob_user:mob_password@postgres:5432/mob_db?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production-please"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-placeholder}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-placeholder}"
      ENVIRONMENT: "development"
      ALLOWED_ORIGINS: "http://localhost:5173,capacitor://localhost"
      ASSISTANT_PROVIDER: "${ASSISTANT_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
      OPENCODE_URL: "${OPENCODE_URL:-http://192.168.252.1:4096}"
      OPENCODE_MODEL: "${OPENCODE_MODEL:-openai/gpt-5.6-sol}"
      PHOTO_DIR: "/data/photos"
    ports:
      - "8080:8080"
    volumes:
      - ./data/photos:/data/photos
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mob-frontend
    environment:
      VITE_PROXY_TARGET: "http://backend:8080"
      VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - package.json
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data:
    driver: local
