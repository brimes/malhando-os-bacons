version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mob-postgres
    environment:
      POSTGRES_USER: mob_user
      POSTGRES_PASSWORD: mob_password
      POSTGRES_DB: mob_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mob_user -d mob_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mob-backend
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://mob_user:mob_password@postgres:5432/mob_db?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production-please"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-placeholder}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-placeholder}"
      ENVIRONMENT: "development"
      ALLOWED_ORIGINS: "http://localhost:5173,capacitor://localhost"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
