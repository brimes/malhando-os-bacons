apiVersion: v1
kind: ConfigMap
metadata:
  name: mob-config
  namespace: brimes
data:
  PORT: "8080"
  ENVIRONMENT: "production"
  # Origens exatas do app Capacitor. O CORS compara string a string.
  # Android usa https://localhost por causa de androidScheme: 'https' no
  # capacitor.config.ts; iOS usa capacitor://localhost.
  ALLOWED_ORIGINS: "capacitor://localhost,https://localhost"
  # Without these the process exits on boot: the assistant provider is required
  # and defaults to gemini. GEMINI_API_KEY lives in the secret.
  ASSISTANT_PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-3.6-flash"
  # Precisa bater com o mountPath do PVC mob-photos em k8s/deployment.yml.
  PHOTO_DIR: "/data/photos"
