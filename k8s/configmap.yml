apiVersion: v1
kind: ConfigMap
metadata:
  name: mob-config
  namespace: brimes
data:
  PORT: "8080"
  ENVIRONMENT: "production"
  ALLOWED_ORIGINS: "https://mob.zel.care"
  # Without these the process exits on boot: the assistant provider is required
  # and defaults to gemini. GEMINI_API_KEY lives in the secret.
  ASSISTANT_PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-3.6-flash"
