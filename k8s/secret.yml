# TEMPLATE — preencha os valores e aplique manualmente uma vez:
#   kubectl apply -f k8s/secret.yml
#
# Gere valores com:
#   openssl rand -hex 32   → JWT_SECRET
#
# DATABASE_URL formato:
#   postgres://mob:<senha>@postgres.brimes.svc.cluster.local:5432/mob_production
#
# NÃO commite este arquivo com valores reais — use GitHub Secrets para o workflow.
apiVersion: v1
kind: Secret
metadata:
  name: mob-secrets
  namespace: brimes
type: Opaque
stringData:
  DATABASE_URL: "postgres://mob:SENHA_AQUI@postgres.brimes.svc.cluster.local:5432/mob_production"
  JWT_SECRET: "GERE_COM_openssl_rand_hex_32"
  # Sem esta chave o processo encerra no boot (ASSISTANT_PROVIDER=gemini).
  # Obtenha em https://aistudio.google.com/apikey
  GEMINI_API_KEY: "SUA_CHAVE_GEMINI"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  # JSON da service account que lê o bucket privado dos vídeos de exercício
  # (assinador-videos@gen-lang-client-0554886676, com objectViewer só nesse
  # bucket). Sem ela o backend sobe igual, os endpoints de vídeo respondem 503
  # e o app funciona sem vídeo — é de propósito, para que deployar o backend
  # não dependa de o secret já existir.
  #
  # Não cole o JSON aqui à mão: uma quebra de linha perdida invalida a chave
  # privada de um jeito que só aparece como 403 na hora de baixar. Aplique
  # direto do arquivo, preservando as outras chaves do secret:
  #
  #   kubectl patch secret mob-secrets -n brimes --type merge \
  #     -p "$(jq -Rs '{stringData:{EXERCISE_VIDEO_CREDENTIALS:.}}' \
  #           ~/.mob-secrets/assinador-videos.json)"
  #
  # Depois reinicie para o pod reler: kubectl rollout restart deploy/mob -n brimes
  EXERCISE_VIDEO_CREDENTIALS: ""
