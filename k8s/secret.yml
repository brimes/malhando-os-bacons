# TEMPLATE — preencha os valores e aplique manualmente uma vez:
#   kubectl apply -f k8s/secret.yml
#
# Gere valores com:
#   openssl rand -hex 32   → JWT_SECRET
#
# DATABASE_URL formato:
#   postgres://mob:<senha>@postgres.brimes.svc.cluster.local:5432/mob_production
#
# NÃO commite este arquivo com valores reais — use GitHub Secrets para o workflow.
apiVersion: v1
kind: Secret
metadata:
  name: mob-secrets
  namespace: brimes
type: Opaque
stringData:
  DATABASE_URL: "postgres://mob:SENHA_AQUI@postgres.brimes.svc.cluster.local:5432/mob_production"
  JWT_SECRET: "GERE_COM_openssl_rand_hex_32"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
