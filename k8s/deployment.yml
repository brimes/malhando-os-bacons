apiVersion: apps/v1
kind: Deployment
metadata:
  name: mob
  namespace: brimes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mob
  # local-path (o provisioner do PVC de fotos) só suporta ReadWriteOnce: um
  # RollingUpdate tentaria montar o mesmo volume em dois pods ao mesmo tempo
  # e travaria esperando um volume que o pod antigo ainda segura. Recreate
  # custa alguns segundos de indisponibilidade, aceitável num app de uso
  # pessoal, e evita essa classe inteira de problema.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mob
    spec:
      securityContext:
        # O container roda como USER nobody (backend/Dockerfile) — no Alpine,
        # uid/gid 65534. Sem isso o pod sobe normal e só falha ao gravar a
        # primeira foto, em runtime, longe do deploy.
        fsGroup: 65534
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: mob-photos
      containers:
        - name: mob
          image: localhost:5000/mob:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mob-config
            - secretRef:
                name: mob-secrets
          volumeMounts:
            - name: photos
              mountPath: /data/photos
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
